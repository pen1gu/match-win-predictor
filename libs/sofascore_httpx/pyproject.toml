[tool.poetry]
name = "sofascore-httpx"
version = "0.1.0"
description = "Sofascore public API client (httpx only)"
authors = ["winner-prediction"]
packages = [{ include = "sofascore_httpx", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.14,<3.15"
